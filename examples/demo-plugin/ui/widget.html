<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Plugin widget</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #bubble {
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 999px;
        background: #ff5c33;
        color: white;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgb(0 0 0 / 0.25);
      }
      #panel {
        width: 260px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        color: #18181b;
        padding: 12px 13px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.2);
        font-size: 13px;
      }
      #panel p {
        margin: 6px 0 0;
        color: #52525b;
        font-size: 12px;
      }
      #panel button {
        margin-top: 10px;
        border: 0;
        background: transparent;
        color: #ff5c33;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }
      @media (prefers-color-scheme: dark) {
        #panel {
          background: #18181b;
          color: #fafafa;
          border-color: #27272a;
        }
        #panel p {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <button id="bubble" type="button" title="Demo Plugin">💬</button>
    <div id="panel" hidden></div>
    <script type="module" src="widget.js"></script>
  </body>
</html>

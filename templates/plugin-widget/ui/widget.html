<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PLUGIN_NAME__ widget</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #bubble {
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgb(0 0 0 / 0.25);
      }
      #panel {
        width: 280px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        color: #18181b;
        padding: 14px;
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.2);
        font-size: 13px;
      }
      #panel h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      #panel p {
        margin: 0 0 10px;
        color: #52525b;
        font-size: 12px;
      }
      #panel input,
      #panel textarea {
        width: 100%;
        margin-bottom: 8px;
        padding: 7px 9px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      #panel textarea {
        min-height: 70px;
        resize: vertical;
      }
      #panel button[type="submit"] {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 8px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #panel button.link {
        margin-top: 8px;
        border: 0;
        background: transparent;
        color: #2563eb;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #16a34a;
      }
      @media (prefers-color-scheme: dark) {
        #panel {
          background: #18181b;
          color: #fafafa;
          border-color: #27272a;
        }
        #panel p {
          color: #a1a1aa;
        }
        #panel input,
        #panel textarea {
          border-color: #3f3f46;
        }
      }
    </style>
  </head>
  <body>
    <button id="bubble" title="Send us a message">💬</button>
    <form id="panel" hidden>
      <h2>__PLUGIN_NAME__</h2>
      <p id="greeting">Questions? Leave us a message.</p>
      <input id="name" placeholder="Your name (optional)" autocomplete="name" />
      <input id="email" type="email" placeholder="Email (optional)" autocomplete="email" />
      <textarea id="body" placeholder="How can we help?" required></textarea>
      <button type="submit">Send message</button>
      <button type="button" class="link" id="close">Close</button>
      <p class="status" id="status" hidden>Thanks! We'll get back to you.</p>
    </form>
    <script type="module" src="widget.js"></script>
  </body>
</html>

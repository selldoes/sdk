name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - plugin-sdk
          - plugin-cli
          - create-selldoes-plugin
  push:
    tags:
      - "sdk-v*"
      - "cli-v*"
      - "create-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Resolve package directory
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.package }}"
          else
            case "${GITHUB_REF_NAME}" in
              sdk-*) name="plugin-sdk" ;;
              cli-*) name="plugin-cli" ;;
              create-*) name="create-selldoes-plugin" ;;
              *) echo "Unknown tag ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
          fi
          case "$name" in
            plugin-sdk) dir="sdk" ;;
            plugin-cli) dir="cli" ;;
            create-selldoes-plugin) dir="create-plugin" ;;
            *) echo "Unknown package $name"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - run: npm run sdk:build

      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
